<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Pasien - Form PPRA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-green-50 text-gray-800">

  <div id="app-layout"></div>

  <main class="md:ml-64 p-4 md:p-8 pb-24 md:pb-8 min-h-screen">
    
    <div class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">Data Pasien & Riwayat</h2>
        <p class="text-gray-500 text-sm">Cari dan kelola riwayat input form PPRA</p>
      </div>
      <a href="input.html" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow transition">
        + Tambah Data Baru
      </a>
    </div>

    <!-- Panel Pencarian & Filter -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-green-100 mb-6 flex flex-col md:flex-row gap-4">
      <div class="flex-1">
        <label class="block text-xs font-medium text-gray-500 mb-1">Pencarian (Nama / No. RM)</label>
        <input type="text" id="searchInput" placeholder="Ketik nama pasien atau No. RM..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none text-sm">
      </div>
      <div class="w-full md:w-48">
        <label class="block text-xs font-medium text-gray-500 mb-1">Dari Tanggal</label>
        <input type="date" id="startDate" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none text-sm">
      </div>
      <div class="w-full md:w-48">
        <label class="block text-xs font-medium text-gray-500 mb-1">Sampai Tanggal</label>
        <input type="date" id="endDate" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none text-sm">
      </div>
      <div class="flex items-end">
        <button id="btnReset" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition">Reset</button>
      </div>
    </div>

    <!-- Tabel Data -->
    <div class="bg-white rounded-xl shadow-sm border border-green-100 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b text-xs uppercase tracking-wider text-gray-500">
              <th class="px-4 py-3 font-medium">Tgl Input</th>
              <th class="px-4 py-3 font-medium">Pasien / RM</th>
              <th class="px-4 py-3 font-medium">Ruangan</th>
              <th class="px-4 py-3 font-medium">Antibiotik</th>
              <th class="px-4 py-3 font-medium">Status Notif</th>
              <th class="px-4 py-3 font-medium text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-gray-100 text-sm">
            <!-- Data akan diisi oleh JavaScript -->
            <tr>
              <td colspan="6" class="px-4 py-8 text-center text-gray-500">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <!-- Info Paginasi (Sederhana) -->
      <div class="p-4 border-t bg-gray-50 text-xs text-gray-500 flex justify-between items-center">
        <span id="totalData">Total: 0 data</span>
      </div>
    </div>

  </main>

  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    let userProfile = null;
    let allData = []; // Menyimpan data di memori untuk pencarian lokal (cepat)

    // Jalankan saat halaman dimuat
    requireAuth().then((authData) => {
      if (authData) {
        userProfile = authData.profile;
        renderLayout('data', userProfile.nama_lengkap, userProfile.role);
        fetchData();
      }
    });

    // Fungsi mengambil data dari Supabase
    async function fetchData() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">Memuat data...</td></tr>';

      // Ambil data form_ppra beserta nama pembuatnya
      const { data, error } = await supabaseClient
        .from('form_ppra')
        .select(`
          id, created_at, tanggal_permintaan, nama_pasien, no_rekam_medis, 
          ruang_rawat_nama, antibiotik_nama, antibiotik_kategori, status_notif,
          profiles (nama_lengkap)
        `)
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-red-500">Gagal memuat data: ${error.message}</td></tr>`;
        return;
      }

      allData = data;
      renderTable(allData);
      document.getElementById('totalData').innerText = `Total: ${allData.length} data`;
    }

    // Fungsi merender tabel ke HTML
    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">Tidak ada data ditemukan.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(row => {
        // Format tanggal input
        const tglInput = new Date(row.created_at).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        
        // Badge status notif
        let badgeNotif = '';
        if (row.status_notif === 'sent') badgeNotif = '<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-semibold">Terkirim</span>';
        else if (row.status_notif === 'failed') badgeNotif = '<span class="bg-red-100 text-red-800 px-2 py-1 rounded text-xs font-semibold">Gagal</span>';
        else badgeNotif = '<span class="bg-gray-100 text-gray-800 px-2 py-1 rounded text-xs font-semibold">Pending</span>';

        // Badge kategori antibiotik
        let catColor = row.antibiotik_kategori === 'Reserve' ? 'text-red-600 bg-red-50' : (row.antibiotik_kategori === 'Watch' ? 'text-yellow-600 bg-yellow-50' : 'text-green-600 bg-green-50');

        return `
          <tr class="hover:bg-gray-50 transition">
            <td class="px-4 py-3 whitespace-nowrap">
              <div class="font-medium text-gray-800">${tglInput}</div>
              <div class="text-xs text-gray-500">Oleh: ${row.profiles?.nama_lengkap || '-'}</div>
            </td>
            <td class="px-4 py-3">
              <div class="font-bold text-gray-800">${row.nama_pasien}</div>
              <div class="text-xs text-gray-500">RM: ${row.no_rekam_medis}</div>
            </td>
            <td class="px-4 py-3 text-gray-600">${row.ruang_rawat_nama || '-'}</td>
            <td class="px-4 py-3">
              <div class="font-medium text-gray-800">${row.antibiotik_nama}</div>
              <div class="text-xs inline-block px-1.5 py-0.5 rounded mt-1 font-semibold ${catColor}">${row.antibiotik_kategori}</div>
            </td>
            <td class="px-4 py-3">${badgeNotif}</td>
            <td class="px-4 py-3 text-right space-x-2">
              <button onclick="alert('Fitur detail akan dibuat di Part selanjutnya')" class="text-blue-600 hover:text-blue-800 text-xs font-medium">Detail</button>
              <button onclick="alert('Fitur print akan dibuat di Part selanjutnya')" class="text-gray-600 hover:text-gray-800 text-xs font-medium">Print</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Logika Pencarian & Filter Tanggal
    function applyFilter() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;

      const filtered = allData.filter(row => {
        // 1. Filter Keyword (Nama atau RM)
        const matchKeyword = row.nama_pasien.toLowerCase().includes(keyword) || 
                             row.no_rekam_medis.toLowerCase().includes(keyword);
        
        // 2. Filter Tanggal (berdasarkan tanggal_permintaan)
        let matchDate = true;
        if (start) matchDate = matchDate && (row.tanggal_permintaan >= start);
        if (end) matchDate = matchDate && (row.tanggal_permintaan <= end);

        return matchKeyword && matchDate;
      });

      renderTable(filtered);
      document.getElementById('totalData').innerText = `Menampilkan: ${filtered.length} dari ${allData.length} data`;
    }

    // Event Listener untuk Input Pencarian & Tanggal
    document.getElementById('searchInput').addEventListener('input', applyFilter);
    document.getElementById('startDate').addEventListener('change', applyFilter);
    document.getElementById('endDate').addEventListener('change', applyFilter);

    // Tombol Reset
    document.getElementById('btnReset').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      document.getElementById('startDate').value = '';
      document.getElementById('endDate').value = '';
      applyFilter();
    });
  </script>
</body>
</html>
